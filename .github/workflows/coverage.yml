name: Code Coverage

on:
  push:
    branches:
      - master
      - develop
      - 'feature/**'
  pull_request:

  # A merge queue validates the PR against the tip of master on its own
  # gh-readonly-queue/** branch. Without this trigger the required checks
  # never report there, every queue entry times out, and nothing can merge.
  merge_group:
jobs:
  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    # The job runs apt-get (variable, occasionally 10+ min on a slow mirror),
    # a full cold coverage build (no ccache), and gcovr. 15 min was too tight:
    # a slow Install-dependencies step left the build <4 min and the job-level
    # timeout cancelled it. 30 min covers the slow-apt + SDL-cache-miss worst case.
    timeout-minutes: 30
    env:
      PKG_CONFIG_PATH: ${{ github.workspace }}/vendor/SDL/install/lib/pkgconfig
      LD_LIBRARY_PATH: ${{ github.workspace }}/vendor/SDL/install/lib

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      # actions/checkout has no retry for submodule fetches, and one PR run does
      # ~9 of them (6 MSVC configs + linux + macos + coverage). A transient
      # "Empty reply from server" from the SDL host therefore reddens a run
      # regularly -- observed on run 30524543939, which passed on re-run with no
      # code change. Retry the fetch instead of the whole job (beads-rbtp).
      - name: Fetch submodules (retried)
        shell: bash
        run: |
          for i in 1 2 3; do
            git submodule update --init --recursive --depth=1 && exit 0
            echo "submodule fetch attempt $i failed; retrying in 15s" >&2
            sleep 15
          done
          echo "submodule fetch failed after 3 attempts" >&2
          exit 1
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config cmake \
            libfreetype6-dev zlib1g-dev libpng-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxss-dev \
            libwayland-dev libxkbcommon-dev libdrm-dev libgbm-dev \
            libdecor-0-dev \
            gcovr lcov

      - name: Cache vendored SDL3
        id: cache-sdl
        uses: actions/cache@v4
        with:
          path: vendor/SDL/install
          key: sdl3-linux-coverage-${{ hashFiles('vendor/SDL/**/*.c', 'vendor/SDL/**/*.h', 'vendor/SDL/CMakeLists.txt') }}

      - name: Build vendored SDL3
        if: steps.cache-sdl.outputs.cache-hit != 'true'
        run: |
          cd vendor/SDL
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/vendor/SDL/install
          cmake --build build -j 3
          cmake --install build

      - name: Build with coverage instrumentation
        run: make -j 3 COVERAGE=1 unit_test

      - name: Generate coverage reports
        run: |
          mkdir -p coverage
          # Generate gcovr reports (JSON for codecov, HTML for artifacts)
          gcovr --root . \
            --filter='src/.*' \
            --exclude='vendor/.*' \
            --exclude='googletest/.*' \
            --exclude='test/.*' \
            --json coverage/coverage.json \
            --html coverage/coverage.html \
            --html-details coverage/coverage-details.html \
            --print-summary

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/coverage.json
          flags: unittests
          name: koncepcja-coverage
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Archive coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage/
          retention-days: 30

      - name: Coverage summary
        run: |
          echo "## Coverage Summary" >> $GITHUB_STEP_SUMMARY
          gcovr --root . --filter='src/.*' --exclude='vendor/.*' --exclude='googletest/.*' --exclude='test/.*' --print-summary | tee -a $GITHUB_STEP_SUMMARY
